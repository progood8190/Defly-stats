<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Defly Elite — Season 11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --arena:#0E0C0A;
  --panel:#211C15;
  --panel-2:#2D2619;
  --line:#41382A;
  --ink:#F3F0E9;
  --ink-2:#ABA396;
  --ink-3:#7C7466;
  --accent:#5FD0A4;
  --gold:#EFC85B;
  --glow-1:#5FD0A4;
  --glow-1a:rgba(95,208,164,.55);
  --glow-2:#EFC85B;
  --glow-2a:rgba(239,200,91,.55);
  --bl:22px;
  --kills:#57C3CE;
  --score:#EE7A6B;
  --towers:#E89B54;
  --kd:#6EAFE6;
  --area:#AC8FE2;
  --level:#E8C55A;
  --plays:#E58BB2;
  --net:#B0A99B;
  --time:#93C56B;
  --games:#5FD0A4;
  --f-display:"Chakra Petch","Barlow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
[data-theme="light"]{
  color-scheme:light;
  --arena:#F4EFE4;
  --panel:#FCF9F2;
  --panel-2:#EFE9DB;
  --line:#DCD3C0;
  --ink:#26221B;
  --ink-2:#6C6455;
  --ink-3:#968D7C;
  --accent:#0D7A57;
  --gold:#9A7413;
  --glow-1:#0D7A57;
  --glow-1a:rgba(13,122,87,.30);
  --glow-2:#9A7413;
  --glow-2a:rgba(154,116,19,.30);
  --bl:11px;
  --kills:#0E7C8A;
  --score:#C0392B;
  --towers:#B0540C;
  --kd:#1D6FB8;
  --area:#6B46C1;
  --level:#96760A;
  --plays:#B03A6E;
  --net:#6B6459;
  --time:#4A7A18;
  --games:#0D7A57;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--arena);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;margin:0 0 26px;padding:0 0 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0}
.topline{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:8px 20px;margin:0 0 22px}
#season-eyebrow{text-align:right}
@keyframes editedGlow{
  0%,100%{color:var(--glow-1);text-shadow:0 0 9px var(--glow-1a)}
  50%    {color:var(--glow-2);text-shadow:0 0 14px var(--glow-2a)}
}
.edited{color:var(--glow-1);animation:editedGlow 4s ease-in-out infinite}
@keyframes bylineGlow{
  0%,100%{color:var(--accent);text-shadow:0 0 var(--bl) var(--accent)}
  25%    {color:var(--gold);  text-shadow:0 0 var(--bl) var(--gold)}
  50%    {color:var(--score); text-shadow:0 0 var(--bl) var(--score)}
  75%    {color:var(--kd);    text-shadow:0 0 var(--bl) var(--kd)}
}
.byline{
  font-family:var(--f-display);font-size:27px;font-weight:600;line-height:1.15;
  letter-spacing:.005em;margin:0;color:var(--accent);
  animation:bylineGlow 10s ease-in-out infinite;
}
h1{font-family:var(--f-display);font-size:38px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1}
h1 em{font-style:normal;color:var(--gold)}
.totals{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.tot{display:flex;flex-direction:column}
.tot b{font-family:var(--f-data);font-size:19px;font-weight:500;line-height:1.2}
.tot span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:var(--f-data)}

.bar-label{font-family:var(--f-data);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.controls{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 22px}
#tip{
  position:absolute;z-index:5;pointer-events:none;
  font-family:var(--f-body);font-size:12.5px;line-height:1.45;
  background:var(--panel-2);color:var(--ink-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;max-width:min(290px,calc(100% - 36px));
  box-shadow:0 8px 24px rgba(0,0,0,.30);
  opacity:0;transform:translateY(-5px);transition:opacity .18s ease,transform .18s ease;
}
#tip.show{opacity:.94;transform:translateY(0)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row + .bar-label{margin-top:18px}
.chip{
  font-family:var(--f-data);font-size:12px;font-weight:500;letter-spacing:.04em;
  background:var(--panel-2);color:var(--ink-2);border:0;
  border-radius:999px;padding:9px 16px;cursor:pointer;transition:.14s;white-space:nowrap;
}
.chip:hover{background:var(--line);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--arena)}
.chip .dot{display:inline-block;width:10px;height:10px;margin-right:8px;vertical-align:-1px}
.chip.on .dot{opacity:.5}
.seg{display:inline-flex;background:var(--panel-2);border-radius:999px;padding:3px;gap:2px}
.seg-btn{
  font-family:var(--f-data);font-size:12px;font-weight:500;letter-spacing:.04em;
  background:transparent;color:var(--ink-2);border:0;border-radius:999px;
  padding:7px 20px;cursor:pointer;transition:.14s;
}
.seg-btn:hover{color:var(--ink)}
.seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--arena)}
.spacer{flex:1;min-width:0}
#theme{display:inline-flex;align-items:center;gap:7px;background:var(--panel-2);color:var(--ink);align-self:flex-end}
#theme:hover{background:var(--line)}
#theme svg{width:13px;height:13px;flex:none}
input[type=search]{
  font-family:var(--f-body);font-size:14px;background:var(--panel-2);color:var(--ink);
  border:0;border-radius:999px;padding:9px 16px;width:190px;
}
input[type=search]::placeholder{color:var(--ink-3)}

.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 22px}
.pod{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:20px 16px 18px;display:flex;flex-direction:column;align-items:center;text-align:center;
}
.pod-inner{display:flex;flex-direction:column;align-items:center;min-width:0;max-width:100%}
.pod-rank{font-family:var(--f-data);font-size:10px;letter-spacing:.16em;color:var(--ink-3);margin:14px 0 4px}
.ring{display:block}
.ring-track{stroke:var(--line)}
.ring-val{font-family:var(--f-data);font-size:19px;font-weight:500;fill:var(--ink)}
.ring-sub{font-family:var(--f-data);font-size:8.5px;letter-spacing:.08em;fill:var(--ink-3)}
.pod-name{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0 0 3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-meta{font-family:var(--f-data);font-size:11px;color:var(--ink-3)}

.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:clip}
.head{
  display:grid;grid-template-columns:46px minmax(0,1.35fr) minmax(0,2fr) 140px;
  gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:3;background:var(--panel);
  font-family:var(--f-data);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
}
.head .r{text-align:right}
.entry{border-bottom:1px solid rgba(37,46,64,.55)}
.entry:last-child{border-bottom:0}
.pl{
  display:grid;grid-template-columns:46px minmax(0,1.35fr) minmax(0,2fr) 140px;
  gap:14px;align-items:center;padding:13px 18px;width:100%;
  background:transparent;border:0;text-align:left;cursor:pointer;color:inherit;font:inherit;
  transition:background .13s;
}
.pl:hover{background:var(--panel-2)}

.pl[aria-expanded="true"]{background:var(--panel-2)}
.rk{font-family:var(--f-data);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rk.top{color:var(--ink)}
.nm{font-size:15px;display:flex;align-items:baseline;min-width:0}
.nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp{font-family:var(--f-data);font-size:11px;color:var(--ink-3);margin-left:8px;flex:none}
.trk{height:10px;border-radius:99px;background:var(--line);overflow:hidden;min-width:40px}
.fil{display:block;height:100%;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.vl{font-family:var(--f-data);font-size:14px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

.detail{padding:4px 18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.st{background:var(--panel-2);border:0;border-radius:10px;padding:13px 14px}
.st span{display:block;font-family:var(--f-data);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st b{font-family:var(--f-data);font-size:16px;font-weight:500;display:block;margin:0 0 7px;font-variant-numeric:tabular-nums}
.st .mini{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.st .mini i{display:block;height:100%;border-radius:99px}
.st em{font-style:normal;font-family:var(--f-data);font-size:10px;color:var(--ink-3);display:block;margin:6px 0 0}

.more{display:block;width:100%;padding:15px;background:transparent;border:0;border-top:1px solid var(--line);color:var(--ink-2);font-family:var(--f-data);font-size:12px;letter-spacing:.06em;cursor:pointer;transition:.13s}
.more:hover{background:var(--panel-2);color:var(--ink)}
.empty{padding:44px 18px;text-align:center;color:var(--ink-3);font-family:var(--f-data);font-size:13px}
footer{margin:24px 0 0;font-family:var(--f-data);font-size:11px;color:var(--ink-3);line-height:1.7}
footer b{color:var(--ink-2);font-weight:500}

@media (max-width:720px){
  h1{font-size:29px}
  .topline{grid-template-columns:1fr;gap:5px}
  #season-eyebrow{text-align:left}
  .totals{gap:16px}
  .podium{grid-template-columns:1fr;gap:10px}
  .pod{flex-direction:row;text-align:left;gap:15px;padding:14px 16px;align-items:center}
  .pod-inner{align-items:flex-start}
  .pod-rank{margin:0 0 4px}
  .pod .ring{flex:none}
  .head,.pl{grid-template-columns:36px minmax(0,1fr) 82px;padding:11px 14px;gap:10px}
  .head .bar-col,.pl .bar-col{display:none}
  .detail{padding:4px 14px 18px}
  input[type=search]{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>

  </div>

</div>

<footer id="notes"></footer>

</div>

<script>
(function(){
"use strict";

var DATA = JSON.parse(document.getElementById('season-data').textContent);

var METRICS = [
  {k:'kills',  label:'Kills',    c:'--kills',  d:0, agg:'total'},
  {k:'score',  label:'Score',    c:'--score',  d:0, agg:'best'},
  {k:'towers', label:'Towers destroyed', c:'--towers', d:0, agg:'total'},
  {k:'kd',     label:'K/D',      c:'--kd',     d:2, agg:'ratio'},
  {k:'area',   label:'Area %',   c:'--area',   d:2, agg:'best'},
  {k:'level',  label:'Level',    c:'--level',  d:0, agg:'best'},
  {k:'deaths', label:'Deaths',   c:'--plays',  d:0, agg:'total'},
  {k:'net',    label:'Net',      c:'--net',    d:0, agg:'total'},
  {k:'secs',   label:'Playtime', c:'--time',   d:0, agg:'total', time:true},
  {k:'games',  label:'Games',    c:'--games',  d:0, agg:'total', allOnly:true}
];

var state = { games:'all', metric:'kills', desc:true, q:'', open:null, limit:50 };

function secOf(t){
  if(typeof t === 'number') return t;
  var p = String(t||'').split(':').map(Number);
  if(p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  if(p.length === 2) return p[0]*60 + p[1];
  return 0;
}
function hms(s){
  s = Math.max(0, Math.round(s));
  var h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h?h+':':'') + String(m).padStart(h?2:1,'0') + ':' + String(x).padStart(2,'0');
}
function num(v,d){
  return v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtDate(iso){
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var q = String(iso || '').split('-');
  if(q.length !== 3) return '';
  var mo = M[(+q[1]) - 1];
  return mo ? (+q[2]) + ' ' + mo + ' ' + q[0] : '';
}
function metric(k){ for(var i=0;i<METRICS.length;i++) if(METRICS[i].k===k) return METRICS[i]; return METRICS[0]; }
function fmt(m,v){ return m.time ? hms(v) : num(v, m.d); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function activeGames(){
  return state.games === 'all' ? DATA.games : DATA.games.filter(function(g){ return g.id === state.games; });
}

function build(){
  var map = {};
  activeGames().forEach(function(g){
    g.rows.forEach(function(r){
      var p = map[r.nickname];
      if(!p){
        p = map[r.nickname] = {name:r.nickname, kills:0, towers:0, plays:0, score:0, level:0, area:0, secs:0, games:0, per:[]};
      }
      p.kills  += r.kills;
      p.towers += r.dot_destroyed;
      p.plays  += r.plays;
      p.secs   += secOf(r.playtime);
      p.score   = Math.max(p.score, r.max_score);
      p.level   = Math.max(p.level, r.max_level);
      p.area    = Math.max(p.area,  r.max_area_pct);
      p.games  += 1;
      p.per.push(g.label);
    });
  });
  return Object.keys(map).map(function(n){
    var p = map[n];
    p.deaths = Math.max(0, p.plays - p.games);
    p.kd  = p.kills / Math.max(1, p.deaths);
    p.net = p.kills - p.deaths;
    return p;
  });
}

function cmp(m){
  return function(a,b){
    var d = a[m.k] === b[m.k] ? 0 : (a[m.k] < b[m.k] ? -1 : 1);
    if(d === 0) return a.name.localeCompare(b.name);
    return state.desc ? -d : d;
  };
}
function ranked(all){
  all.sort(cmp(metric(state.metric)));
  all.forEach(function(p,i){ p.rank = i+1; });
  return all;
}
function rankOf(list, p, m){
  var f = cmp(m), n = 1;
  for(var i=0;i<list.length;i++) if(list[i] !== p && f(list[i], p) < 0) n++;
  return n;
}
function searched(list){
  var q = state.q.trim().toLowerCase();
  if(!q) return list;
  return list.filter(function(p){ return p.name.toLowerCase().indexOf(q) !== -1; });
}

function ring(pct, color, main, sub, size){
  size = size || 138;
  var w = 13;
  var r = size/2 - 11, c = 2*Math.PI*r, off = c*(1 - Math.max(0,Math.min(1,pct)));
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc(main)+'">'
    + '<circle class="ring-track" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="'+w+'"/>'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var('+color+')" stroke-width="'+w+'" stroke-linecap="round"'
    + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'
    + '<text class="ring-val" x="'+size/2+'" y="'+(size/2-4)+'" text-anchor="middle" dominant-baseline="central">'+esc(main)+'</text>'
    + '<text class="ring-sub" x="'+size/2+'" y="'+(size/2+15)+'" text-anchor="middle" dominant-baseline="central">'+esc(sub)+'</text>'
    + '</svg>';
}

function gem(fill){
  return '<svg class="dot" viewBox="0 0 10 10" aria-hidden="true">'
    + '<path d="M5 0C5.6 2.4 7.6 4.4 10 5C7.6 5.6 5.6 7.6 5 10C4.4 7.6 2.4 5.6 0 5C2.4 4.4 4.4 2.4 5 0Z"'
    + ' style="fill:'+fill+'"/></svg>';
}
function renderChips(){
  var gr = document.getElementById('games-row');
  var html = '<button class="chip" data-g="all" aria-pressed="'+(state.games==='all')+'">All games</button>';
  DATA.games.forEach(function(g){
    html += '<button class="chip" data-g="'+esc(g.id)+'" aria-pressed="'+(state.games===g.id)+'">'+esc(g.label)+'</button>';
  });
  gr.innerHTML = html;

  var mr = document.getElementById('metrics-row'), mh = '';
  METRICS.forEach(function(m){
    if(m.allOnly && state.games !== 'all') return;
    var on = state.metric === m.k;
    mh += '<button class="chip'+(on?' on':'')+'" data-m="'+m.k+'" aria-pressed="'+on+'"'
       + (on ? ' style="background:var('+m.c+');color:var(--arena)"' : '')
       + '>' + gem(on ? 'currentColor' : 'var('+m.c+')') + m.label + '</button>';
  });
  mr.innerHTML = mh;

  var segs = document.querySelectorAll('[data-dir]');
  for(var i=0;i<segs.length;i++){
    segs[i].setAttribute('aria-pressed', String((segs[i].getAttribute('data-dir') === 'desc') === state.desc));
  }
}

function renderTotals(){
  var k=0,t=0,pl=0,s=0;
  DATA.games.forEach(function(g){ g.rows.forEach(function(r){
    k += r.kills; t += r.dot_destroyed; pl += r.plays; s = Math.max(s, r.max_score);
  });});
  var names = {};
  DATA.games.forEach(function(g){ g.rows.forEach(function(r){ names[r.nickname]=1; }); });
  var items = [
    [Object.keys(names).length, 'Players'],
    [DATA.games.length, 'Games'],
    [k.toLocaleString(), 'Kills'],
    [t.toLocaleString(), 'Towers destroyed'],
    [s.toLocaleString(), 'Top score']
  ];
  document.getElementById('totals').innerHTML = items.map(function(i){
    return '<div class="tot"><b>'+i[0]+'</b><span>'+i[1]+'</span></div>';
  }).join('');
}

function renderPodium(list){
  var m = metric(state.metric), el = document.getElementById('podium');
  if(!list.length){ el.innerHTML=''; return; }
  var lead = list[0][m.k] || 1;
  el.innerHTML = list.slice(0,3).map(function(p,i){
    var pct = state.desc ? (lead ? p[m.k]/lead : 0) : (p[m.k] ? lead/p[m.k] : 0);
    return '<div class="pod">'
      + ring(pct, m.c, fmt(m,p[m.k]), m.label.toUpperCase())
      + '<div class="pod-inner">'
      + '<p class="pod-rank">#'+(i+1)+'</p>'
      + '<p class="pod-name">'+esc(p.name)+'</p>'
      + '<p class="pod-meta">'+p.games+' game'+(p.games===1?'':'s')+' · '+p.kills+' kill'+(p.kills===1?'':'s')+'</p>'
      + '</div></div>';
  }).join('');
}

function renderRows(view, full){
  var m = metric(state.metric), el = document.getElementById('rows');
  document.getElementById('head-val').textContent = m.label;
  if(!view.length){
    el.innerHTML = '<p class="empty">No players match that filter. Try clearing the search.</p>';
    return;
  }
  var vals = full.map(function(p){ return p[m.k]; });
  var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
  var span = hi - lo;
  var multi = state.games === 'all' && DATA.games.length > 1;
  var shown = view.slice(0, state.limit);
  el.innerHTML = shown.map(function(p,i){
    var frac = span > 0 ? (p[m.k] - lo)/span : 1;
    if(!state.desc) frac = 1 - frac;
    frac = Math.max(0.02, frac);
    var open = state.open === p.name;
    return '<div class="entry">'
      + '<button class="pl" data-n="'+esc(p.name)+'" aria-expanded="'+open+'">'
      +   '<span class="rk'+(p.rank<=3?' top':'')+'">'+p.rank+'</span>'
      +   '<span class="nm"><span class="nmt">'+esc(p.name)+'</span>'
      +     (multi ? '<span class="gp" title="games played">\u00d7'+p.games+'</span>' : '')+'</span>'
      +   '<span class="trk bar-col"><i class="fil" style="width:'+(frac*100).toFixed(1)+'%;background:var('+m.c+')"></i></span>'
      +   '<span class="vl">'+fmt(m,p[m.k])+'</span>'
      + '</button>'
      + (open ? detail(p, full) : '')
      + '</div>';
  }).join('') + (view.length > shown.length
      ? '<button class="more" id="more">Show all '+view.length+' players</button>' : '');
}

function detail(p, list){
  return '<div class="detail">' + METRICS.filter(function(m){
    return !(m.allOnly && state.games !== 'all');
  }).map(function(m){
    var vals = list.map(function(x){ return x[m.k]; });
    var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
    var frac = hi > lo ? (p[m.k]-lo)/(hi-lo) : 1;
    return '<div class="st"><span>'+m.label+'</span><b>'+fmt(m,p[m.k])+'</b>'
      + '<div class="mini"><i style="width:'+Math.max(2,frac*100).toFixed(1)+'%;background:var('+m.c+')"></i></div>'
      + '<em>#'+rankOf(list, p, m)+'</em></div>';
  }).join('') + '</div>';
}

function renderNotes(){
  var g = DATA.games.map(function(x){ return x.label; }).join(', ');
  document.getElementById('notes').innerHTML =
      '<b>Across all games</b> — kills, towers destroyed and playtime are summed; score, level and area take your single best game.<br>'
    + '<b>Deaths</b> — your first spawn in a game is not a death, so deaths are plays minus games played. K/D and Net use that same count; a flawless run counts as one death for the division.<br>'
    + '<b>Loaded</b> — ' + esc(g) + '.';
  var upd = fmtDate(DATA.updated);
  document.getElementById('edited-line').innerHTML =
    upd ? 'Last edited <span class="edited">' + esc(upd) + '</span>' : '';
  document.getElementById('season-eyebrow').textContent = 'Season ' + DATA.season;
  document.title = 'Defly Elite — Season ' + DATA.season;
}

var HINTS = {
  net: 'Net = kills \u2212 deaths. Above 0 means more kills than times you went down.'
};
var hintTimer = null;
function hint(key, text){
  var tip = document.getElementById('tip');
  var btn = document.querySelector('[data-m="'+key+'"]');
  if(!tip || !btn) return;
  tip.textContent = text;
  tip.classList.remove('show');
  var pad = 18, wrapW = document.querySelector('.controls').clientWidth;
  tip.style.top = (btn.offsetTop + btn.offsetHeight + 8) + 'px';
  tip.style.left = '';
  tip.style.right = '';
  var w = Math.min(290, wrapW - 36);
  tip.style.left = Math.max(pad, Math.min(btn.offsetLeft, wrapW - w - pad)) + 'px';
  void tip.offsetWidth;
  tip.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ tip.classList.remove('show'); }, 3400);
}

function render(){
  renderChips();
  var full = ranked(build());
  renderTotals();
  renderPodium(full);
  renderRows(searched(full), full);
}

document.addEventListener('click', function(e){
  var b = e.target.closest('button');
  if(!b) return;
  if(b.dataset.g){ state.games = b.dataset.g; state.open = null;
    if(metric(state.metric).allOnly && state.games !== 'all') state.metric = 'kills';
    render(); return; }
  if(b.dataset.m){
    var mk = b.dataset.m;
    state.metric = mk;
    render();
    if(HINTS[mk]) hint(mk, HINTS[mk]);
    return;
  }
  if(b.getAttribute('data-dir')){ state.desc = b.getAttribute('data-dir') === 'desc'; render(); return; }
  if(b.id === 'more'){ state.limit = Infinity; render(); return; }
  if(b.classList.contains('pl')){
    state.open = state.open === b.dataset.n ? null : b.dataset.n;
    render(); return;
  }
});
document.getElementById('q').addEventListener('input', function(e){ state.q = e.target.value; state.open = null; render(); });

var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4M12 19.8v2.4M4.4 4.4l1.7 1.7M17.9 17.9l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.4 19.6l1.7-1.7M17.9 6.1l1.7-1.7"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20.8 13.4A8.6 8.6 0 1 1 10.6 3.2a6.8 6.8 0 0 0 10.2 10.2z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme').innerHTML = (t === 'light' ? MOON + 'Dark' : SUN + 'Light');
  try{ localStorage.setItem('defly-theme', t); }catch(e){}
}
function initTheme(){
  var t = null;
  try{ t = localStorage.getItem('defly-theme'); }catch(e){}
  if(t !== 'light' && t !== 'dark'){
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  applyTheme(t);
}
document.getElementById('theme').addEventListener('click', function(){
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
});

initTheme();
renderNotes();
render();
})();
</script>
</body>
</html>
